services:
  # =========================
  # COURSE SERVICE
  # =========================
  course-service-db:
    image: mysql:8.0
    container_name: course-service-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: lms_course_service
    ports:
      - "3307:3306"
    volumes:
      - course-service-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 10

  course-service:
    build: ./backend/services/course-service
    container_name: course-service
    ports:
      - "7878:7878"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://course-service-db:3306/lms_course_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      course-service-db:
        condition: service_healthy

  # =========================
  # CLASS SCHEDULE SERVICE
  # =========================
  class-schedule-service-db:
    image: mysql:8.0
    container_name: class-schedule-service-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: lms_class_schedule_service
    ports:
      - "3308:3306"
    volumes:
      - class-schedule-service-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 10

  class-schedule-service:
    build: ./backend/services/class-schedule-service
    container_name: class-schedule-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://class-schedule-service-db:3306/lms_class_schedule_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345
      SERVICES_COURSE_BASEURL: http://course-service:7878
    depends_on:
      class-schedule-service-db:
        condition: service_healthy
      course-service:
        condition: service_started

  # =========================
  # QUIZ SERVICE
  # =========================
  quiz-service-db:
    image: mysql:8.0
    container_name: quiz-service-db
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: lms_quiz_service
    ports:
      - "3309:3306"
    volumes:
      - quiz-service-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345"]
      interval: 10s
      timeout: 5s
      retries: 10

  quiz-service:
    build: ./backend/services/quiz-service
    container_name: quiz-service
    ports:
      - "8093:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://quiz-service-db:3306/lms_quiz_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      quiz-service-db:
        condition: service_healthy

volumes:
  course-service-db-data:
  class-schedule-service-db-data:
  quiz-service-db-data: