server:
  port: 8084

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lms_content?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    config:
      enabled: false
    import-check:
      enabled: false
