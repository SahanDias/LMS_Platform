spring:
  application:
    name: LMS Notification Service

  datasource:
    url: jdbc:mysql://localhost:3310/lms_notification_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 12345
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 7880

external:
  notifications:
    course-url: http://localhost:7878/api/courses/completions
    payment-url: http://localhost:8080/payments
